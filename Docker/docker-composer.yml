version: "3.8"

services:

  api-gateway:
    build: ../services/eventmart-gateway
    ports:
      - "8080:8080"
    depends_on:
      - product-service
    networks:
      - micro-net

  product-service:
    build: ../services/eventmart-product-service
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - product-db
    networks:
      - micro-net

  product-db:
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    networks:
      - micro-net

networks:
  micro-net: