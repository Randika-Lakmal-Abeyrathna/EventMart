spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    connect-retries: 10

  security:
    oauth2:
      resourceserver:
        jwt:
          # Use jwk-set-uri so the service fetches keys from the Docker-internal Keycloak
          # without strictly validating the issuer hostname (localhost vs keycloak).
          # This allows tokens obtained from http://localhost:8081 to be accepted.
          jwk-set-uri: http://keycloak:8080/realms/eventmart/protocol/openid-connect/certs
