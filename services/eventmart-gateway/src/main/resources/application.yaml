server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: product-service-products
              uri: http://product-service:8081
              predicates:
                - Path=/api/v1/products, /api/v1/products/, /api/v1/products/**

            - id: product-service-category
              uri: http://product-service:8081
              predicates:
                - Path=/api/v1/productcategory, /api/v1/productcategory/, /api/v1/productcategory/**